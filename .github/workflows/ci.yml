name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # postinstall is guarded for source checkouts (scripts/lifecycle.cjs,
      # legate-s4b) so a plain `npm ci` works, but we still skip lifecycle
      # scripts on CI: install-command writes skill cards to ~/.claude on the
      # runner, which is pointless work there. `npm test` runs `tsc` first,
      # producing `build/` itself.
      - run: npm ci --ignore-scripts

      - run: npm test

  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # See comment in the `test` job: lifecycle scripts are skipped on CI.
      - run: npm ci --ignore-scripts

      # Build first so the dry-run reflects the real published contents of
      # `build/`, not just the always-present `scripts/`/README files.
      - run: npm run build

      # Fails if the `files` array in package.json regresses (e.g. `scripts/`
      # accidentally dropped) or the package otherwise fails to pack.
      - run: npm pack --dry-run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # See comment in the `test` job: lifecycle scripts are skipped on CI.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      # format:check is intentionally not gated in CI: the existing codebase's
      # style (aligned inline comments, single-line try/catch bodies, long
      # chained `.describe()` calls) produces a large reflow under Prettier's
      # defaults that isn't worth forcing right now. `npm run format:check` /
      # `npm run format` remain available locally and in editors via
      # .prettierrc.
