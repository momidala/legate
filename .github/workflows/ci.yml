name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # postinstall is guarded for source checkouts (scripts/lifecycle.cjs,
      # legate-s4b) so a plain `npm ci` works, but we still skip lifecycle
      # scripts on CI: install-command writes skill cards to ~/.claude on the
      # runner, which is pointless work there. `npm test` runs `tsc` first,
      # producing `build/` itself.
      - run: npm ci --ignore-scripts

      - run: npm test

  test-windows:
    # legate-od3: the codebase has real win32 branches (src/cli.ts npm_config_global
    # handling, src/autostart.ts opencode.cmd) that the ubuntu-only `test` job above
    # never exercises. This job runs the same `npm test` (tsc + node --test build/)
    # on Windows. It deliberately does NOT run `npm run build` — that script's
    # `chmod 755 ...` step is POSIX-only and would fail under Windows cmd/pwsh;
    # `npm test`'s own `tsc && node --test build/` never invokes it.
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # See comment in the `test` job: lifecycle scripts are skipped on CI.
      - run: npm ci --ignore-scripts

      - run: npm test

  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # See comment in the `test` job: lifecycle scripts are skipped on CI.
      - run: npm ci --ignore-scripts

      # Build first so the dry-run reflects the real published contents of
      # `build/`, not just the always-present `scripts/`/README files.
      - run: npm run build

      # Fails if the `files` array in package.json regresses (e.g. `scripts/`
      # accidentally dropped) or the package otherwise fails to pack.
      - run: npm pack --dry-run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # See comment in the `test` job: lifecycle scripts are skipped on CI.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      # Cheapest place for a standalone type-check: `npm test` already runs `tsc`
      # (no --noEmit) as a side effect of producing `build/`, but this makes the
      # type-check an explicit, independently-failing gate without adding a
      # whole new job/matrix leg just for it.
      - run: npm run typecheck

      # legate-4ah: format:check became a real gate after the one-time Prettier
      # reflow (commit listed in .git-blame-ignore-revs — git blame skips it).
      # A permanently-red or absent check was worse than either alternative.
      - run: npm run format:check
